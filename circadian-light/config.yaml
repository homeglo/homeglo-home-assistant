# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Circadian Light by HomeGlo
version: "1.4.89"
slug: circadian-light
description: Circadian Light honors your circadian rhythm by intuitively adapting smart lights' color and brightness to your daily pattern
url: "https://github.com/rweisbein/circadian-light-by-HomeGlo"
arch:
  - aarch64
  - amd64
init: false
auth_api: true
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: false
ports:
  8472/tcp: 8472
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:lightbulb
panel_title: Circadian Light
panel_admin: false
options:
  product_api_origin: ""
schema:
  product_api_origin: str?

# Fresh host interface facts for safe Product API advertisement only.
hassio_api: true
hassio_role: default
backup_pre: /bin/sh /usr/bin/homeglo-activity-backup
backup_exclude:
  - "*/activity/activity.db"
  - "*/activity/activity.db-wal"
  - "*/activity/activity.db-shm"
  - "*/activity/.activity.*.tmp*"
image: ghcr.io/homeglo/circadian-light
